<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <script>

        let puntuaciones = []

        for (let i = 0; i < 10; i++) {
            let puntos = Number(prompt("Introduce la puntuación de la tirada " + (i + 1) + ":"))
            puntuaciones.push(puntos)
        }


    </script>

    
</body>
